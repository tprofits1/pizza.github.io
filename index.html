<!DOCTYPE html>
<html>
<head>
  <title>Stacked Images</title>
  <style>
    .image-container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    img {
      max-width: 100%;
      height: auto;
      margin-bottom: 10px; 
    }
  </style>
</head>
<body>

  <div class="image-container">
    <img src="pizza_judge_sheet_Mac.jpg" alt="Amy">
    <img src="pizza_judge_sheet_Cali.jpg" alt="Cali">
    <img src="pizza_judge_sheet_Morgan.jpg" alt="Morgan">
    <img src="pizza_judge_sheet_Brady.jpg" alt="Brady">
    <img src="pizza_judge_sheet_Ethan.jpg" alt="Ethan">
    <img src="pizza_judge_sheet_Amy.jpg" alt="Amy">
    <img src="pizza_judge_sheet_Trevor.jpg" alt="Trevor">
  </div>

</body>
</html>
